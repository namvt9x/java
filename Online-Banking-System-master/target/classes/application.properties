spring.datasource.url=jdbc:mysql://localhost:3306/OnlineBankingSystem
spring.datasource.username=root
spring.datasource.password=
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1

payment.procedure.name=prc_process_payment
payment.primary-account-update-sql=UPDATE primary_account SET account_balance = account_balance - ? WHERE id = (SELECT primary_account_id FROM user WHERE username = ?)
payment.savings-account-update-sql=UPDATE savings_account SET account_balance = account_balance - ? WHERE id = (SELECT savings_account_id FROM user WHERE username = ?)
